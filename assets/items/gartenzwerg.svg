<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- body / robe -->
  <path d="M 36 78 Q 32 116 64 118 Q 96 116 92 78 Z" fill="#3060a8" stroke="#1a2848" stroke-width="4" stroke-linejoin="round"/>
  <!-- belt -->
  <rect x="36" y="92" width="56" height="6" fill="#3a1f08" stroke="#1a0f04" stroke-width="2"/>
  <!-- belt buckle -->
  <rect x="60" y="91" width="8" height="9" fill="#d4a13a" stroke="#1a0f04" stroke-width="1"/>
  <!-- beard -->
  <path d="M 40 64 Q 48 92 64 96 Q 80 92 88 64 Q 88 74 80 78 Q 64 80 48 78 Q 40 74 40 64" fill="#f8f0e0" stroke="#a09080" stroke-width="3" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="64" cy="50" r="18" fill="#f0c098" stroke="#5a2810" stroke-width="3"/>
  <!-- nose -->
  <ellipse cx="64" cy="58" rx="7" ry="9" fill="#e08868"/>
  <!-- eyes -->
  <circle cx="55" cy="50" r="2" fill="#2a1004"/>
  <circle cx="73" cy="50" r="2" fill="#2a1004"/>
  <!-- mustache -->
  <path d="M 50 64 Q 56 72 64 68 Q 72 72 78 64" fill="none" stroke="#a09080" stroke-width="4" stroke-linecap="round"/>
  <!-- hat (conical) -->
  <path d="M 36 38 L 64 6 L 92 38 Q 88 44 64 44 Q 40 44 36 38 Z" fill="#c83838" stroke="#3a1004" stroke-width="4" stroke-linejoin="round"/>
  <!-- hat highlight -->
  <path d="M 64 12 L 76 32" fill="none" stroke="#e88080" stroke-width="3" stroke-linecap="round"/>
</svg>

  <!-- wood grain -->
  <path d="M 30 36 Q 64 32 98 36" fill="none" stroke="#5a2810" stroke-width="2"/>
  <path d="M 30 52 Q 64 48 98 52" fill="none" stroke="#5a2810" stroke-width="2"/>
  <path d="M 32 72 Q 64 68 96 72" fill="none" stroke="#5a2810" stroke-width="2"/>

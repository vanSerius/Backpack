<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- roof -->
  <path d="M 16 50 L 64 16 L 112 50 Z" fill="#6a3a14" stroke="#2a1004" stroke-width="4" stroke-linejoin="round"/>
  <!-- roof shingles line -->
  <path d="M 28 50 L 64 26 L 100 50" fill="none" stroke="#3a1f08" stroke-width="2"/>
  <!-- body -->
  <rect x="20" y="50" width="88" height="54" fill="#8a5028" stroke="#2a1004" stroke-width="4"/>
  <!-- clock face -->
  <circle cx="64" cy="74" r="20" fill="#f3e6c9" stroke="#2a1004" stroke-width="3"/>
  <!-- clock hands -->
  <line x1="64" y1="74" x2="64" y2="60" stroke="#2a1004" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="74" x2="76" y2="74" stroke="#2a1004" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="74" r="2" fill="#2a1004"/>
  <!-- numbers (dots) -->
  <circle cx="64" cy="58" r="1.5" fill="#2a1004"/>
  <circle cx="80" cy="74" r="1.5" fill="#2a1004"/>
  <circle cx="64" cy="90" r="1.5" fill="#2a1004"/>
  <circle cx="48" cy="74" r="1.5" fill="#2a1004"/>
  <!-- pendulum -->
  <line x1="64" y1="104" x2="64" y2="118" stroke="#2a1004" stroke-width="2"/>
  <circle cx="64" cy="120" r="6" fill="#d4a13a" stroke="#2a1004" stroke-width="2"/>
</svg>

  <path d="M 30 32 L 98 32 L 100 70 L 90 110 L 70 110 L 64 70 L 58 110 L 38 110 L 28 70 Z" fill="#7a4a20" stroke="#3a1f08" stroke-width="4" stroke-linejoin="round"/>

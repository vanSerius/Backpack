  <path d="M 50 32 L 78 32 L 78 60 Q 78 66 64 66 Q 50 66 50 60 Z" fill="#8a5a28" stroke="#3a1f08" stroke-width="3" stroke-linejoin="round"/>
  <!-- decorative stitching -->
